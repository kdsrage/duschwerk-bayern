# ─────────────────────────────────────────────────
#  duschwerk-bayern.de  →  Frontend (static build)
# ─────────────────────────────────────────────────
server {
    listen 80;
    server_name duschwerk-bayern.de www.duschwerk-bayern.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name duschwerk-bayern.de www.duschwerk-bayern.de;

    ssl_certificate     /etc/letsencrypt/live/duschwerk-bayern.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/duschwerk-bayern.de/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/duschwerk-bayern/frontend/dist;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Statische Assets – lang cachen
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA-Fallback: alle Routen an index.html übergeben
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ─────────────────────────────────────────────────
#  api.duschwerk-bayern.de  →  Backend (Port 3001)
# ─────────────────────────────────────────────────
server {
    listen 80;
    server_name api.duschwerk-bayern.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.duschwerk-bayern.de;

    ssl_certificate     /etc/letsencrypt/live/api.duschwerk-bayern.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.duschwerk-bayern.de/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
